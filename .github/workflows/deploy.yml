name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.set-path.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node build step
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.detect.outputs.has_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_build == 'true'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.has_build == 'true'
        run: npm run build

      - name: Determine output folder
        id: set-path
        run: |
          if [ "${{ steps.detect.outputs.has_build }}" = "true" ]; then
            if [ -d dist ]; then
              echo "path=dist" >> "$GITHUB_OUTPUT"
            elif [ -d build ]; then
              echo "path=build" >> "$GITHUB_OUTPUT"
            elif [ -d out ]; then
              echo "path=out" >> "$GITHUB_OUTPUT"
            else
              echo "path=." >> "$GITHUB_OUTPUT"
            fi
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.set-path.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
